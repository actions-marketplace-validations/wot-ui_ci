name: Release

# 只认完整版本号（v1.2.3 / v1.2.3-beta.1）。
# 浮动主版本 tag（v0 / v1）由 marketplace-listing.yml 维护，不应该触发发版。
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tag must match package.json version
        run: node scripts/verify-release.mjs "$GITHUB_REF_NAME"

      - name: action.yml must be Marketplace-ready
        run: node scripts/verify-action-metadata.mjs

      # 这一关防的是「有人删了 draft 配置」：release 一旦直接发布，
      # Marketplace 复选框就再也不会出现，只能删掉 release 重来。
      - name: Release must stay a draft
        run: |
          node -e '
            const fs = require("node:fs")
            const config = JSON.parse(fs.readFileSync("changelogithub.config.json", "utf8"))
            if (config.draft !== true) {
              console.error("::error::changelogithub.config.json 必须设置 draft: true，否则 GitHub Release 直接发布，Marketplace 复选框永久消失")
              process.exit(1)
            }
            console.log("✔ release 会以 draft 形式创建")
          '

      - run: pnpm lint
      - run: pnpm typecheck:all
      - run: pnpm build
      - run: pnpm test:run

  release:
    name: Publish npm + draft release
    needs: verify
    uses: sxzz/workflows/.github/workflows/release.yml@v1
    with:
      publish: true
    permissions:
      contents: write
      id-token: write

  ensure-draft:
    name: Ensure draft release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Draft release must exist for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft,url > release.json 2>/dev/null; then
            echo "::error::没有找到 $TAG 的 GitHub Release。changelog.github 那步带 continue-on-error，失败会被静默吞掉，去日志里翻 changelogithub 的输出。"
            exit 1
          fi

          node -e '
            const fs = require("node:fs")
            const { isDraft, url } = JSON.parse(fs.readFileSync("release.json", "utf8"))
            if (!isDraft) {
              console.error("::error::release 已经是正式发布状态，Marketplace 复选框不会再出现。检查 changelogithub.config.json 的 draft 配置。")
              process.exit(1)
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              "## 还差一步：勾选 Marketplace",
              "",
              `1. 打开 ${url}（draft release）`,
              "2. 勾选 **Publish this Action to the GitHub Marketplace**",
              "3. 选择 Primary / Secondary category 后点 **Publish release**",
              "",
              "> GitHub 没有公开 API 能勾这个框，只能人工点一次。发布后 `Marketplace Listing` workflow 会校验 listing 是否跟上。",
              "",
            ].join("\n"))
            console.log(`✔ draft release 就绪：${url}`)
          '
